---
- name: Deploy tech-test app
  hosts: fixme
  become: true

  vars:
    app_dir: /opt/tech-test/app

  tasks:
    - name: Install dependencies
      dnf:
        name:
          - python3
          - python3-pip
          - rsync
        state: present

    - name: Install uv
      pip:
        name: uv
        executable: pip3

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy app files
      synchronize:
        src: ../app/
        dest: "{{ app_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=.venv"
          - "--exclude=__pycache__"

    - name: Install Python dependencies
      command:
        cmd: uv sync
        chdir: "{{ app_dir }}"

    - name: Install systemd unit
      template:
        src: templates/tech-test.service.j2
        dest: /etc/systemd/system/tech-test.service
        owner: root
        group: root
        mode: "0644"
      become: false

    - name: Enable and start service
      systemd:
        name: tech-test
        enabled: true
        state: started
        daemon_reload: true
