---
- name: Deploy tech-test app
  hosts: all
  become: true

  vars:
    app_repo: "https://github.com/davidevi-taskize/tech-test.git"
    app_dir: /opt/tech-test
    app_user: techtest

  tasks:
    - name: Install dependencies
      dnf:
        name:
          - git
          - python3
          - python3-pip
        state: present

    - name: Install uv
      pip:
        name: uv
        executable: pip3

    - name: Create app user
      user:
        name: "{{ app_user }}"
        system: true
        shell: /sbin/nologin
        home: "{{ app_dir }}"
        create_home: false

    - name: Clone repository
      git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: main
        force: true
      become_user: root

    - name: Set app directory ownership
      file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    - name: Install Python dependencies
      command:
        cmd: uv sync
        chdir: "{{ app_dir }}/app"
      become_user: "{{ app_user }}"

    - name: Install systemd unit
      template:
        src: templates/tech-test.service.j2
        dest: /etc/systemd/system/tech-test.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start service
      systemd:
        name: tech-test
        enabled: true
        state: started
        daemon_reload: true
